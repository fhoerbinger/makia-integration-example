[project]
name = "makia-bridge-example"
version = "0.1.0"
description = "A small, readable example of a bridge between a customer database and MAKIA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mssql = ["pyodbc>=5"]
dev = ["pytest>=8"]

[project.scripts]
bridge = "makia_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["makia_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"
