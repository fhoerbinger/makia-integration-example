[project]
name = "makia-integration-example"
version = "0.1.0"
description = "A small integration between a customer database and MAKIA, built on makia-integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["makia-integration"]

[project.optional-dependencies]
mssql = ["pyodbc>=5"]
dev = ["pytest>=8"]

[tool.uv.sources]
makia-integration = { path = "./makia-integration-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["example_integration"]

[tool.ruff]
line-length = 100
target-version = "py312"
