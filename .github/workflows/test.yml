name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ./makia-integration-py[dev] .[dev] ruff==0.15.12
      - run: ruff check . && ruff format --check .
      - run: pytest -q makia-integration-py/tests
      - run: pytest -q tests
      - name: the built wheel works
        shell: bash
        run: |
          pip wheel --no-deps -w dist ./makia-integration-py
          python -m venv wheel-venv
          if [ -d wheel-venv/Scripts ]; then BIN=wheel-venv/Scripts; else BIN=wheel-venv/bin; fi
          "$BIN/python" -m pip install dist/makia_integration-*.whl
          "$BIN/makia-integration" new tmp-integration
          test -f tmp-integration/.env.example
          "$BIN/python" -c "import makia_integration as m, pathlib; assert (pathlib.Path(m.__file__).parent / 'docs' / 'openapi.json').is_file()"
